server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:ratelimiter_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      httpclient:
        response-timeout: 5s
        connect-timeout: 2000
      routes:
        - id: sample-api-route
          uri: http://localhost:${SAMPLE_API_PORT:8082}
          predicates:
            - Path=/gateway/**
          filters:
            - StripPrefix=1

gateway:
  cache:
    ttl-seconds: 300
    eviction-interval-ms: 60000
  fail-open: ${REDIS_FAIL_OPEN:true}
